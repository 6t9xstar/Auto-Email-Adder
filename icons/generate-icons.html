<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Generate Icons</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      text-align: center;
    }
    canvas {
      border: 1px solid #ddd;
      margin: 10px;
    }
    .icon-box {
      display: inline-block;
      margin: 20px;
    }
    button {
      padding: 10px 20px;
      margin: 5px;
      cursor: pointer;
      background: #1a73e8;
      color: white;
      border: none;
      border-radius: 4px;
    }
    button:hover {
      background: #1557b0;
    }
  </style>
</head>
<body>
  <h1>Auto Email Adder - Icon Generator</h1>
  <p>Click each button to download the icon files:</p>

  <div class="icon-box">
    <canvas id="canvas16" width="16" height="16"></canvas>
    <br>
    <button onclick="downloadIcon(16)">Download icon16.png</button>
  </div>

  <div class="icon-box">
    <canvas id="canvas48" width="48" height="48"></canvas>
    <br>
    <button onclick="downloadIcon(48)">Download icon48.png</button>
  </div>

  <div class="icon-box">
    <canvas id="canvas128" width="128" height="128"></canvas>
    <br>
    <button onclick="downloadIcon(128)">Download icon128.png</button>
  </div>

  <script>
    function drawIcon(canvas, size) {
      const ctx = canvas.getContext('2d');
      
      // Background
      ctx.fillStyle = '#1a73e8';
      roundRect(ctx, 0, 0, size, size, size * 0.15);
      ctx.fill();
      
      // @ symbol
      ctx.fillStyle = 'white';
      ctx.font = `bold ${size * 0.6}px Arial, sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('@', size * 0.45, size * 0.55);
      
      // Plus badge
      ctx.fillStyle = '#34a853';
      ctx.beginPath();
      ctx.arc(size * 0.78, size * 0.22, size * 0.2, 0, Math.PI * 2);
      ctx.fill();
      
      ctx.fillStyle = 'white';
      ctx.font = `bold ${size * 0.25}px Arial, sans-serif`;
      ctx.fillText('+', size * 0.78, size * 0.24);
    }

    function roundRect(ctx, x, y, width, height, radius) {
      ctx.beginPath();
      ctx.moveTo(x + radius, y);
      ctx.lineTo(x + width - radius, y);
      ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
      ctx.lineTo(x + width, y + height - radius);
      ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
      ctx.lineTo(x + radius, y + height);
      ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
      ctx.lineTo(x, y + radius);
      ctx.quadraticCurveTo(x, y, x + radius, y);
      ctx.closePath();
    }

    function downloadIcon(size) {
      const canvas = document.getElementById('canvas' + size);
      const link = document.createElement('a');
      link.download = 'icon' + size + '.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    }

    // Draw all icons on load
    window.onload = function() {
      drawIcon(document.getElementById('canvas16'), 16);
      drawIcon(document.getElementById('canvas48'), 48);
      drawIcon(document.getElementById('canvas128'), 128);
    };
  </script>
</body>
</html>
